# Production topology for a single Linux host:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# TLS termination belongs to a host-level reverse proxy (see deploy/Caddyfile.example).
services:
  # =========================================================================
  # WARNING (OWASP A05): DynamoDB Local is a development-grade, single-file,
  # UNAUTHENTICATED database. It is a stopgap for this self-hosted topology:
  # it accepts any AWS-shaped credentials and has no access control, backup,
  # or durability story. It is only tolerable here because it is confined to
  # the compose-internal network (no host ports at all). Real production data
  # must live in real AWS DynamoDB (drop DDB_ENDPOINT_URL and supply real AWS
  # credentials) or another authenticated, durable database.
  # =========================================================================
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    working_dir: /home/dynamodblocal
    # Least privilege: run as the image's unprivileged default user
    # (dynamodblocal, uid/gid 1000). The dynamodb-init one-shot below fixes
    # the named volume's root ownership so this user can open its sqlite file.
    user: "1000:1000"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    volumes:
      - ddb-data:/home/dynamodblocal/data
    healthcheck:
      # DynamoDB Local answers (400 on a bare GET) once it's actually serving;
      # -f would treat that 400 as failure, so just check curl connects.
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  # One-shot: hand the root-owned named volume to the unprivileged user that
  # the dynamodb service runs as. Root is confined to this short-lived chown.
  dynamodb-init:
    image: amazon/dynamodb-local:2.5.2
    user: root
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /home/dynamodblocal/data"]
    volumes:
      - ddb-data:/home/dynamodblocal/data
    restart: "no"

  # S3-compatible attachment store. MinIO's images were withdrawn from Docker
  # Hub and quay.io, so this is SeaweedFS (single-node `weed server` + S3 API).
  # Identities are rendered from env at startup: the admin key (bucket
  # creation only, used by s3-init), the app key (read/write on the asset
  # bucket only), and anonymous read limited to the IMAGE/ and DATA/ prefixes.
  # -ip.bind=0.0.0.0 lets docker's port forwarding reach the S3 port; the
  # master/volume/filer ports stay unpublished, reachable only on the
  # compose-internal network (same trust boundary as DynamoDB Local above).
  s3:
    image: chrislusf/seaweedfs:4.00
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?set in .env.production}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?set in .env.production}
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:?set in .env.production}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:?set in .env.production}
      ASSET_S3_BUCKET: ${ASSET_S3_BUCKET:-algodoo-assets}
    entrypoint: ["/bin/sh", "-c"]
    # Anonymous download is a deliberate decision: this bucket serves ONLY
    # public assets (legacy board attachments), and every key the app writes
    # lives under the IMAGE/ (images) or DATA/ (.phz/.phn scenes + thumbnails)
    # prefixes — see packages/data/src/algodoo_data/uploads.py. The anonymous
    # identity is scoped to exactly those prefixes (no listing) so nothing
    # else ever becomes publicly readable. Any future private data needs a
    # separate bucket (or presigned URLs), never this one.
    command:
      - |
        umask 077
        cat > /tmp/s3.json <<JSON
        {"identities": [
          {"name": "admin",
           "credentials": [{"accessKey": "$$S3_ADMIN_ACCESS_KEY", "secretKey": "$$S3_ADMIN_SECRET_KEY"}],
           "actions": ["Admin", "Read", "Write", "List", "Tagging"]},
          {"name": "app",
           "credentials": [{"accessKey": "$$S3_APP_ACCESS_KEY", "secretKey": "$$S3_APP_SECRET_KEY"}],
           "actions": ["Read:$$ASSET_S3_BUCKET", "Write:$$ASSET_S3_BUCKET", "List:$$ASSET_S3_BUCKET"]},
          {"name": "anonymous",
           "actions": ["Read:$$ASSET_S3_BUCKET/IMAGE/*", "Read:$$ASSET_S3_BUCKET/DATA/*"]}
        ]}
        JSON
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3-data:/data
    ports:
      # Published for asset delivery via the host reverse proxy.
      - "127.0.0.1:9000:8333"
    healthcheck:
      # Any HTTP answer from the S3 port (403 for an anonymous bucket list)
      # means the gateway is serving.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY:?set in .env.production}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY:?set in .env.production}
      AWS_DEFAULT_REGION: us-east-1
      ASSET_S3_BUCKET: ${ASSET_S3_BUCKET:-algodoo-assets}
    entrypoint: ["/bin/sh", "-c"]
    # The filer may still be warming up right after the S3 port answers.
    command:
      - |
        for _ in $$(seq 1 30); do
          if aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$$ASSET_S3_BUCKET" 2>/dev/null \
            || aws --endpoint-url http://s3:8333 s3api create-bucket --bucket "$$ASSET_S3_BUCKET" >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        exit 1
    restart: "no"

  app:
    build: .
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      # Strict production startup checks (refuse local auth / default API key /
      # insecure cookies). CI overrides this via --env-file .env.ci (APP_ENV=ci).
      APP_ENV: ${APP_ENV:-production}
      DDB_ENDPOINT_URL: http://dynamodb:8000
      ASSET_S3_ENDPOINT_URL: http://s3:8333
      # DynamoDB Local validates the access-key format, so it gets an AWS-shaped
      # dummy; the asset store authenticates with its own app key.
      AWS_ACCESS_KEY_ID: LOCALDDBACCESSKEY
      AWS_SECRET_ACCESS_KEY: localddbsecret
      ASSET_S3_ACCESS_KEY_ID: ${S3_APP_ACCESS_KEY:?set in .env.production}
      ASSET_S3_SECRET_ACCESS_KEY: ${S3_APP_SECRET_KEY:?set in .env.production}
      # Trust X-Forwarded-* only from the compose network gateway: the host
      # reverse proxy (Caddy) reaches the loopback-published port through
      # docker's NAT, so its connections appear to come from the gateway of
      # the pinned subnet below. Never widen this to '*'.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.1}
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - app-media:/app/media
    depends_on:
      dynamodb:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ddb-data:
  s3-data:
  app-media:

networks:
  # Pinned so the gateway address is deterministic and FORWARDED_ALLOW_IPS can
  # trust exactly the host-side reverse proxy's source address. Override both
  # values together if 172.28.0.0/24 collides with an existing network.
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_NETWORK_SUBNET:-172.28.0.0/24}
          gateway: ${COMPOSE_NETWORK_GATEWAY:-172.28.0.1}
