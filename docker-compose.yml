# Script-running dev/test services share the `dev` stage of the Dockerfile:
# the stock uv image with git (ddb-single git dependency) and ffmpeg
# (Playwright MP4 muxing) preinstalled at image build time, so containers do
# not run apt-get at startup (OWASP A08). `docker compose up` builds it
# automatically on first run; the scripts keep an apt fallback for the rare
# case the tools are missing.
x-dev-image: &dev-image
  image: algodooonline-dev
  build:
    context: .
    target: dev

services:
  dynamodb:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /tmp
    command: ["sh", "-c", "uv run --with 'moto[server]>=5.1.22' moto_server -H 0.0.0.0 -p 8000"]
    environment:
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      UV_LINK_MODE: copy
    ports:
      # Loopback-only: dev services must not listen on all host interfaces.
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/moto-api/', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    volumes:
      - uv-cache:/root/.cache/uv

  s3:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /tmp
    command: ["sh", "-c", "uv run --with 'moto[server]>=5.1.22' moto_server -H 0.0.0.0 -p 8000"]
    environment:
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      UV_LINK_MODE: copy
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/moto-api/', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    volumes:
      - uv-cache:/root/.cache/uv

  app:
    <<: *dev-image
    working_dir: /app
    command: ["sh", "/app/scripts/start-dev.sh"]
    environment:
      APP_NAME: algodooonline
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DDB_TABLE_NAME: algodoo-main-local
      DDB_ENDPOINT_URL: http://dynamodb:8000
      ASSET_S3_BUCKET: algodoo-assets-local
      ASSET_S3_ENDPOINT_URL: http://s3:8000
      ASSET_PUBLIC_BASE_URL: http://localhost:8002/algodoo-assets-local
      ASSET_S3_PUBLIC_ACL: "true"
      SEED_DEMO_DATA: "true"
      LEGACY_X_API_KEY: local-x-api-key
      UV_LINK_MODE: copy
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      dynamodb:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
    networks:
      default:
        aliases:
          # Chromium hardcodes ".app" as an HSTS-preloaded TLD and forces
          # https:// for any host literally named "app", breaking the plain
          # http:// local stack for browser-driven (Playwright) tests. The
          # `e2e` service targets this alias instead of the service name.
          - webapp

  integration:
    <<: *dev-image
    profiles: ["test"]
    working_dir: /app
    command: ["sh", "/app/scripts/integration-local.sh"]
    environment:
      BASE_URL: http://app:8000
      S3_INTERNAL_BASE_URL: http://s3:8000/algodoo-assets-local
      ASSET_PUBLIC_BASE_URL: http://localhost:8002/algodoo-assets-local
      LEGACY_X_API_KEY: local-x-api-key
      # For the migration integration test (old 4 tables -> single table).
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DDB_ENDPOINT_URL: http://dynamodb:8000
      DDB_TABLE_NAME: algodoo-main-migration
      UV_LINK_MODE: copy
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv

  # Playwright browser e2e test covering every legacy screen (SPEC.md) end to end.
  e2e:
    <<: *dev-image
    profiles: ["e2e"]
    working_dir: /app
    command: ["sh", "/app/scripts/e2e-local.sh"]
    # Chromium needs more than the default 64MB /dev/shm or it crashes mid-run.
    shm_size: "1gb"
    environment:
      # Not http://app:8000: Chromium force-upgrades that to https:// (see
      # the `webapp` alias comment on the `app` service) and the plain HTTP
      # dev stack has no TLS listener.
      BASE_URL: http://webapp:8000
      UV_LINK_MODE: copy
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv
      - playwright-browsers:/root/.cache/ms-playwright

  # Cognito auth backend test: the same moto server also emulates cognito-idp.
  app-cognito:
    <<: *dev-image
    profiles: ["test-cognito"]
    working_dir: /app
    command: ["sh", "/app/scripts/start-cognito-test.sh"]
    environment:
      APP_NAME: algodooonline
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DDB_TABLE_NAME: algodoo-main-cognito
      DDB_ENDPOINT_URL: http://dynamodb:8000
      SEED_DEMO_DATA: "false"
      AUTH_BACKEND: cognito
      COGNITO_ENDPOINT_URL: http://dynamodb:8000
      LEGACY_X_API_KEY: cognito-test-api-key
      UV_LINK_MODE: copy
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      dynamodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv

  integration-cognito:
    <<: *dev-image
    profiles: ["test-cognito"]
    working_dir: /app
    command: ["sh", "/app/scripts/integration-cognito.sh"]
    environment:
      BASE_URL: http://app-cognito:8000
      UV_LINK_MODE: copy
    depends_on:
      app-cognito:
        condition: service_healthy
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv

  # Production-parity Lambda test: integration-lambda builds dist/lambda (the
  # zip's tree), which the official Lambda Python runtime (Runtime Interface
  # Emulator) serves behind an API Gateway HTTP API (payload 2.0) stand-in;
  # then scripts/integration_local.py runs against it unchanged.
  lambda:
    image: public.ecr.aws/lambda/python:3.12
    profiles: ["test-lambda"]
    command: ["algodoo_web.lambda_handler.handler"]
    environment:
      AWS_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DDB_TABLE_NAME: algodoo-main-lambda
      DDB_ENDPOINT_URL: http://dynamodb:8000
      ASSET_S3_BUCKET: algodoo-assets-lambda
      ASSET_S3_ENDPOINT_URL: http://s3:8000
      ASSET_PUBLIC_BASE_URL: http://localhost:8002/algodoo-assets-lambda
      ASSET_S3_PUBLIC_ACL: "true"
      SEED_DEMO_DATA: "true"
      LEGACY_X_API_KEY: local-x-api-key
      # Lambda's filesystem is read-only outside /tmp.
      MEDIA_ROOT: /tmp/media
      # The build tree is mounted via its parent directory: build_lambda.sh
      # rewrites dist/lambda, which would leave a direct bind mount stale.
      PYTHONPATH: /opt/dist/lambda
    volumes:
      - ./dist:/opt/dist:ro
    depends_on:
      dynamodb:
        condition: service_healthy
      s3:
        condition: service_healthy

  lambda-gateway:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["test-lambda"]
    command: ["python3", "/app/scripts/lambda_gateway.py"]
    environment:
      LAMBDA_INVOKE_URL: http://lambda:8080/2015-03-31/functions/function/invocations
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      - lambda

  integration-lambda:
    <<: *dev-image
    profiles: ["test-lambda"]
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "sh scripts/build_lambda.sh && uv sync --all-packages && uv run python scripts/wait_http.py http://lambda-gateway:8000/healthz && uv run python scripts/integration_local.py",
      ]
    environment:
      BASE_URL: http://lambda-gateway:8000
      S3_INTERNAL_BASE_URL: http://s3:8000/algodoo-assets-lambda
      ASSET_PUBLIC_BASE_URL: http://localhost:8002/algodoo-assets-lambda
      LEGACY_X_API_KEY: local-x-api-key
      UV_LINK_MODE: copy
    depends_on:
      - lambda-gateway
    volumes:
      - .:/app
      - uv-cache:/root/.cache/uv

volumes:
  uv-cache:
  playwright-browsers:
