[pytest]
addopts =
    --screenshot=only-on-failure
    # Videos are embedded into the self-contained report.html (a CI artifact),
    # so recording every run would expose auth-screen footage. Opt back in
    # with E2E_VIDEO=on (see pytest_configure in conftest.py).
    --video=retain-on-failure
    --tracing=retain-on-failure
    --html=test-results/report.html
    --self-contained-html
