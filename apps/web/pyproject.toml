[project]
name = "algodoo-web"
version = "0.1.0"
description = "Unified Python web application for algodooonline."
requires-python = ">=3.12"
dependencies = [
  "algodoo-domain",
  "algodoo-data",
  "boto3>=1.34.79",
  "fastapi>=0.115.12",
  "jinja2>=3.1.6",
  "uvicorn>=0.34.2",
  "mangum>=0.19.0",
  "markdown>=3.10.2",
  "bleach>=6.3.0",
  "pyjwt[crypto]>=2.9",
]

[tool.uv.sources]
algodoo-domain = { workspace = true }
algodoo-data = { workspace = true }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
algodoo_web = ["templates/*.html", "templates/*.css"]
