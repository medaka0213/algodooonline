name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Run ruff
        run: uv run ruff check .

      - name: Parse Python files
        run: >
          python3 -B -c "import ast, pathlib;
          [ast.parse(p.read_text()) for p in pathlib.Path('.').glob('**/*.py')
          if '.venv' not in p.parts and '__pycache__' not in p.parts and 'vendor' not in p.parts];
          print('syntax ok')"

  integration:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run local integration test (web + legacy API + migration)
        run: docker compose --profile test up --abort-on-container-exit --exit-code-from integration

      - name: Stop local integration stack
        if: always()
        run: docker compose down --volumes

  e2e:
    name: Playwright E2E Test (all legacy screens)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run Playwright e2e test
        run: docker compose --profile e2e up --abort-on-container-exit --exit-code-from e2e

      - name: Upload Playwright artifacts (screenshots/video/trace on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop e2e stack
        if: always()
        run: docker compose --profile e2e down --volumes

  integration-cognito:
    name: Cognito Auth Backend Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run cognito integration test (moto cognito-idp)
        run: >
          docker compose --profile test-cognito up
          --abort-on-container-exit --exit-code-from integration-cognito

      - name: Stop cognito integration stack
        if: always()
        run: docker compose --profile test-cognito down --volumes

  lambda:
    name: Lambda Package Integration Test (Lambda runtime + HTTP API payload 2.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the Lambda zip and run the integration test through it
        run: >
          docker compose --profile test-lambda up
          --abort-on-container-exit --exit-code-from integration-lambda

      - name: Stop Lambda integration stack
        if: always()
        run: docker compose --profile test-lambda down --volumes

      - name: Keep the tested Lambda zip for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-zip
          path: dist/lambda.zip
          if-no-files-found: error
          retention-days: 1

      - name: Validate Terraform (infra/aws)
        run: |
          docker run --rm -v "$PWD/infra/aws:/w" -w /w hashicorp/terraform:1.10.5 init -backend=false -input=false
          docker run --rm -v "$PWD/infra/aws:/w" -w /w hashicorp/terraform:1.10.5 fmt -check
          docker run --rm -v "$PWD/infra/aws:/w" -w /w hashicorp/terraform:1.10.5 validate

  prod-image:
    name: Production Image + Compose Topology Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build and start the production topology (local auth backend)
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci up -d --build

      - name: Wait for app health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          echo "app never became healthy" >&2
          docker compose -f docker-compose.prod.yml --env-file .env.ci logs app
          exit 1

      - name: Run integration test against the production topology
        env:
          BASE_URL: http://127.0.0.1:8080
          ASSET_PUBLIC_BASE_URL: http://localhost:9000/algodoo-assets
          S3_INTERNAL_BASE_URL: http://127.0.0.1:9000/algodoo-assets
          LEGACY_X_API_KEY: local-x-api-key
        run: python3 scripts/integration_local.py

      - name: Stop production topology
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci down --volumes

  deploy:
    name: Deploy to AWS Lambda
    # Inert until the repository variable AWS_DEPLOY_ROLE_ARN is set (the
    # `github_deploy_role_arn` output of infra/aws), so merging this before the
    # role exists does not turn main red.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    needs: [lint, integration, e2e, integration-cognito, lambda, prod-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a newer merge waits instead of cancelling a running one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FUNCTION_NAME: algodooonline-web
      SITE_URL: https://algodooonline.net
    steps:
      - name: Download the Lambda zip that passed the tests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-zip

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Update the function code
        run: |
          local_sha=$(openssl dgst -sha256 -binary lambda.zip | base64)
          current_sha=$(aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query Configuration.CodeSha256 --output text)
          if [ "$local_sha" = "$current_sha" ]; then
            echo "Deployed code already matches this commit ($current_sha); nothing to do."
            exit 0
          fi
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip --query CodeSha256 --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          deployed_sha=$(aws lambda get-function --function-name "$FUNCTION_NAME" \
            --query Configuration.CodeSha256 --output text)
          if [ "$deployed_sha" != "$local_sha" ]; then
            echo "::error::Deployed hash $deployed_sha does not match the built zip $local_sha"
            exit 1
          fi

      - name: Smoke test the live site
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$SITE_URL/healthz"
          echo
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$SITE_URL/i/BBS" \
            -o /dev/null -w "/i/BBS %{http_code}\n"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$SITE_URL/" \
            | grep -q "AlgodooOnline \[ver 2.0\]"
