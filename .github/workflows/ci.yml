name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Run ruff
        run: uv run ruff check .

      - name: Parse Python files
        run: >
          python3 -B -c "import ast, pathlib;
          [ast.parse(p.read_text()) for p in pathlib.Path('.').glob('**/*.py')
          if '.venv' not in p.parts and '__pycache__' not in p.parts and 'vendor' not in p.parts];
          print('syntax ok')"

  integration:
    name: Docker Compose Integration Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run local integration test
        run: docker compose --profile test up --abort-on-container-exit --exit-code-from integration

      - name: Stop local integration stack
        if: always()
        run: docker compose down --volumes
