name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Run ruff
        run: uv run ruff check .

      - name: Parse Python files
        run: >
          python3 -B -c "import ast, pathlib;
          [ast.parse(p.read_text()) for p in pathlib.Path('.').glob('**/*.py')
          if '.venv' not in p.parts and '__pycache__' not in p.parts and 'vendor' not in p.parts];
          print('syntax ok')"

  test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start local integration stack
        run: docker compose up -d

      - name: Wait for app health
        run: |
          for _ in $(seq 1 60); do
            if docker compose exec -T app python - >/dev/null 2>&1 <<'PY'
          from urllib.request import urlopen

          urlopen("http://127.0.0.1:8000/healthz", timeout=2).read()
          PY
            then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Run local smoke test
        run: docker compose exec -T app python /app/scripts/smoke_local.py

      - name: Stop local integration stack
        if: always()
        run: docker compose down --volumes
